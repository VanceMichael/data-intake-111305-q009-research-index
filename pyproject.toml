[project]
name = "research-index"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = []

[tool.unittest]
start-directory = "tests"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research_index", "research_index.fixtures"]

[tool.setuptools.package-dir]
"research_index.fixtures" = "fixtures"

[tool.setuptools.package-data]
"research_index.fixtures" = ["*.json"]
